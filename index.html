<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#FFFFFF">
<title>Toonzi 2D</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&family=Caveat:wght@600;700&family=Bangers&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app" data-layout="desktop">
  <header class="top">
    <span class="logo" aria-hidden="true"><img class="logo-l" src="assets/logo.svg" alt="" width="30" height="30"><img class="logo-d" src="assets/logo-dark.png" alt="" width="30" height="30"></span>
    <input class="proj-name" id="projName" aria-label="Project name" value="Untitled animation">
    <div class="grp" id="topLeft"></div>
    <div class="spacer"></div>
    <div class="grp" id="topRight"></div>
  </header>

  <nav class="rail" id="rail" aria-label="Tools"></nav>

  <main class="stage-area" id="stageWrap">
    <div id="stageDoc" class="stage-doc" aria-hidden="true"></div>
    <canvas id="stage" aria-label="Stage"></canvas>
    <canvas id="ovl" aria-hidden="true"></canvas>
    <div class="ctxbar" id="ctxbar"></div>
    <div class="zoombadge" id="zoomBadge" aria-label="Stage zoom">
      <button data-z="out" title="Zoom out">−</button><span id="zoomPct">100%</span><button data-z="in" title="Zoom in">+</button><button data-z="fit" title="Fit to screen">Fit</button>
    </div>
    <button class="focusmenu" id="focusMenu" type="button" title="Menu" aria-label="Menu"></button>
  </main>

  <aside class="inspector" id="inspector" aria-label="Properties"></aside>
  <div class="insp-grip" id="inspGrip" title="Drag to resize the panel" aria-hidden="true"></div>

  <section class="dock" id="dock">
    <div class="dock-grip" id="dockGrip" title="Drag to resize"></div>
    <div class="transport" id="transport"></div>
    <div class="dock-tabs" id="dockTabs" role="tablist"></div>
    <div class="dock-body" id="dockBody">
      <div class="framesbar" id="framesBar"></div>
      <div class="tl" id="tl"><div class="tl-inner" id="tlInner"></div></div>
      <div class="dock-props" id="dockProps"></div>
      <div class="ixpanel" id="ixPanel" hidden></div>
    </div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<div class="modal" id="modal" hidden></div>
<div id="avpool" aria-hidden="true"></div>

<!-- Libraries -->
<script src="vendor/mediabunny.js"></script>
<script src="vendor/polygon-clipping.min.js"></script>
<!-- Core: helpers, state, layer tree, keyframes, matrices -->
