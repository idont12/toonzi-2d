<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" class="happy">
<!-- Toonzi, happy. Edit freely: keep the viewBox; the classes body, eyes and mouth are what the animations below move. The eyes do most of the talking. -->
<style>
.body{transform-origin:52px 98px;animation:breathe 3.2s ease-in-out infinite}
.eyes{transform-origin:53px 47px;animation:blink 4.6s infinite}
.pupils{animation:glance 5s ease-in-out infinite}
.talking .body{animation:chat .6s ease-in-out infinite alternate}
.talking .mouth{transform-box:fill-box;transform-origin:center;animation:talk .3s ease-in-out infinite alternate}
.talking .pupils{animation:talkeyes .6s ease-in-out infinite alternate}
.happy .body{animation:bob 1.4s ease-in-out infinite}
.happy .eyes{animation:blink 5.4s infinite}
.cheering .body{animation:hop .55s ease-in-out infinite alternate}
.cheering .eyes{animation:none}
.cheering .pupils{animation:none}
.cheering .star{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
.winking .body{animation:wink 3s ease-in-out infinite}
.winking .eyes{animation:none}
.idea .body{animation:bounce 1.6s ease-in-out infinite}
.idea .pupils{animation:peek 2.4s ease-in-out infinite}
.thinking .body{animation:tilt 3s ease-in-out infinite;transform-origin:52px 98px}
.thinking .pupils{animation:ponder 3.6s ease-in-out infinite}
.looking .body{animation:lean 2.4s ease-in-out infinite}
.looking .pupils{animation:look 2.4s ease-in-out infinite}
.surprised .body{animation:jump .9s ease-out infinite}
.surprised .eyes{animation:none;transform-origin:53px 47px}
.surprised .pupils{transform-box:fill-box;animation:shrink .9s ease-out infinite}
.sad .body{animation:droop 4s ease-in-out infinite}
.sad .eyes{animation:blink 6s infinite}
.sad .pupils{animation:tremble 2s ease-in-out infinite}
.spark{transform-box:fill-box;transform-origin:center;animation:twinkle .8s ease-in-out infinite alternate}.spark.s2{animation-delay:.4s}.spark.s3{animation-delay:.2s}
.bulb{animation:glow 1.1s ease-in-out infinite alternate}
.dots circle{animation:dot 1.5s ease-in-out infinite}.dots circle:nth-child(2){animation-delay:.25s}.dots circle:nth-child(3){animation-delay:.5s}
.tear{animation:tear 2.2s ease-in infinite}
.shock{animation:shock .9s ease-out infinite}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes glance{0%,40%,100%{transform:translate(0,0)}55%,75%{transform:translate(-1.6px,-.8px)}}
@keyframes chat{to{transform:translateY(-1.2px) rotate(-1.2deg)}}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.15)}}
@keyframes talkeyes{from{transform:translate(0,0)}to{transform:translate(.8px,-.8px)}}
@keyframes bob{50%{transform:translateY(-2px) rotate(-2deg)}}
@keyframes hop{to{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wink{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg)}}
@keyframes bounce{50%{transform:translateY(-2.5px)}}
@keyframes peek{0%,100%{transform:translate(0,0)}50%{transform:translate(1.4px,-1.6px)}}
@keyframes tilt{50%{transform:rotate(-4deg)}}
@keyframes ponder{0%,100%{transform:translate(0,0)}50%{transform:translate(-1.6px,-1.2px)}}
@keyframes lean{50%{transform:rotate(-3deg)}}
@keyframes look{0%,100%{transform:translateX(0)}50%{transform:translateX(2.6px)}}
@keyframes jump{0%,100%{transform:translateY(0)}20%{transform:translateY(-6px)}}
@keyframes shrink{0%,100%{transform:scale(1)}20%{transform:scale(.8)}}
@keyframes droop{50%{transform:scale(1.01,.965)}}
@keyframes tremble{0%,100%{transform:translate(0,0)}25%{transform:translate(.5px,.3px)}75%{transform:translate(-.5px,.2px)}}
@keyframes twinkle{from{transform:scale(.6);opacity:.5}to{transform:scale(1.15);opacity:1}}
@keyframes glow{to{filter:drop-shadow(0 0 4px #FFE36E)}}
@keyframes dot{50%{transform:translateY(-2px);opacity:1}}
@keyframes tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(14px);opacity:0}}
@keyframes shock{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="c1"><ellipse rx="19.44" ry="27.09"/></clipPath><clipPath id="c2"><ellipse rx="18.02" ry="27.10"/></clipPath></defs>
<g transform="translate(9 10) scale(.82)"><g class="body"><path d="M33.72 19.96C22.04 20.12 14.17 23.91 7.88 34.12C-5.18 55.29 5.84 91.88 30.94 98.70C38.53 100.77 46.00 99.90 52.83 95.90C56.26 93.88 58.54 90.87 61.23 88.08C63.23 88.85 65.21 89.88 67.35 90.34C74.83 91.97 82.17 90.20 87.76 84.83C107.93 65.46 95.43 19.11 68.42 12.15C62.89 10.73 56.98 11.48 52.03 14.41C49.23 16.07 47.22 18.43 45.03 20.73C41.73 16.10 38.68 11.22 35.47 6.50C34.23 4.67 33.15 2.53 31.70 0.86C31.33 0.44 30.85 0.10 30.28 0.01C28.63 -0.23 23.76 2.85 22.07 3.69C20.75 4.35 14.70 6.90 14.15 7.77C13.58 8.67 13.49 9.82 14.26 10.65C15.36 11.84 17.64 12.51 19.09 13.15C23.93 15.29 29.20 17.37 33.72 19.96Z" fill="#332052"/><g class="eyes"><ellipse cx="37.85" cy="50.61" rx="18.64" ry="26.29" transform="rotate(-10.6 37.85 50.61)" fill="#fff"/><ellipse cx="68.57" cy="42.48" rx="17.22" ry="26.30" transform="rotate(-10.6 68.57 42.48)" fill="#fff"/><g class="pupils"><g transform="translate(40.70 47.06) scale(1.0)"><path d="M0 0V-9.96A7.23 10.43 -16.5 1 0 6.33 -3.3Z" fill="#332052"/></g><g transform="translate(65.17 40.64) scale(1.0)"><path d="M0 0V-9.96A7.23 10.43 -16.5 1 0 6.33 -3.3Z" fill="#332052"/></g></g><g transform="translate(37.85 50.61) rotate(-10.6)" clip-path="url(#c1)"><path d="M-30 20Q0 1 30 20V40H-30Z" fill="#332052"/></g><g transform="translate(68.57 42.48) rotate(-10.6)" clip-path="url(#c2)"><path d="M-30 20Q0 1 30 20V40H-30Z" fill="#332052"/></g></g><path class="mouth" d="M59.5 77.5Q66 85 73 77.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g></g>
</svg>
